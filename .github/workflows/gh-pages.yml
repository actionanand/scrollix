name: GitHub Pages - Angular 21.0.3

on:
  push:
    branches:
      - main-github

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Inject PASSWORD_HASH into environment.ts
        env:
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}
        run: |
          sed -i "s|PASSWORD_HASH_PLACEHOLDER|${{ env.PASSWORD_HASH }}|g" src/environments/environment.ts

      - name: Generate Android asset links
        env:
          SHA256_FINGERPRINT: ${{ secrets.SHA256_FINGERPRINT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: npm run generate:assetlinks

      - name: Extract repository name from package.json
        id: package
        run: echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Build Angular app for GitHub Pages
        run: npm run build:gh --configuration=production

      - name: Copy error files to redirect to home
        run: npm run copy-error-page

      - name: Copy asset links to deployed .well-known folder
        run: |
          mkdir -p dist/${{ steps.package.outputs.name }}/browser/.well-known
          cp public/.well-known/assetlinks.json dist/${{ steps.package.outputs.name }}/browser/.well-known/assetlinks.json
          touch dist/${{ steps.package.outputs.name }}/browser/.nojekyll

      - name: Deploy
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_href: /${{ steps.package.outputs.name }}/ # make sure this corresponds to https://<your_username>.github.io/<base_href>/
          deploy_branch: gh-pages
          publish_dir: dist/${{ steps.package.outputs.name }}/browser
          enable_jekyll: true
