name: Android APK & AAB Build

on:
  push:
    branches:
      - main-android

permissions:
  contents: write

# ── Android SDK version targets — edit here when Google requires a new target ──
env:
  MIN_SDK_VERSION: 24 # Android 7.0 (Nougat) — update when Google mandates a newer minimum (currently 24 for Play Store)
  TARGET_SDK_VERSION: 35 # Android 15 (UpsideDownCake) — update when Google mandates a newer target
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Opt into Node.js 24 for all actions (required from June 2026)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Inject secrets into environment.ts
        env:
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}
          TOKEN_HASH: ${{ secrets.TOKEN_HASH }}
        run: |
          sed -i "s|PASSWORD_HASH_PLACEHOLDER|$PASSWORD_HASH|g" src/environments/environment.ts
          sed -i "s|TOKEN_PLACEHOLDER|$TOKEN_HASH|g" src/environments/environment.ts

      - name: Build Angular app (production)
        run: npm run build -- --configuration=production

      - name: Install Capacitor CLI & Android platform
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Install image processing tools
        run: sudo apt-get install -y imagemagick

      - name: Add Android platform
        run: npx cap add android

      - name: Patch build.gradle to accept version properties
        working-directory: android/app
        run: |
          # Replace hardcoded versionCode/versionName with Gradle properties (fallback to defaults)
          sed -i \
            's/versionCode [0-9]*/versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1/' \
            build.gradle
          sed -i \
            's/versionName "[^"]*"/versionName project.hasProperty("versionName") ? project.versionName : "1.0.0"/' \
            build.gradle
          echo "✅ build.gradle patched for dynamic versioning"
          # Patch minSdkVersion and targetSdkVersion in variables.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = $MIN_SDK_VERSION/" ../variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $TARGET_SDK_VERSION/" ../variables.gradle
          echo "✅ variables.gradle patched: minSdk=$MIN_SDK_VERSION targetSdk=$TARGET_SDK_VERSION"

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Inject app icon
        run: |
          # Copy source icon to all required Android mipmap densities
          ICON_SRC="public/scrollix.png"
          # Remove adaptive icon XML so Android uses our PNG directly
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            mkdir -p "android/app/src/main/res/$DIR"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              "android/app/src/main/res/$DIR/ic_launcher.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              "android/app/src/main/res/$DIR/ic_launcher_round.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          # Play Store icon (512x512) — save for reference
          convert "$ICON_SRC" -resize 512x512 releases/playstore-icon.png 2>/dev/null || true
          echo "✅ Icons injected"

      - name: Auto-bump versionCode
        run: |
          node scripts/bump-android-version.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-version.json
          git commit -m "chore: auto-bump android versionCode [skip ci]"
          git push

      - name: Build APK & AAB with Gradle
        working-directory: android
        run: |
          VERSION_CODE=$(node -p "require('../android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('../android-version.json').versionName")
          echo "Building versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew assembleRelease bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect keystore type & normalise KEY_PASSWORD for PKCS12 ──────────────
      # PKCS12 uses a single passphrase: the key password MUST equal the store
      # password. JKS allows them to differ. We detect the type here and write
      # the effective key password to GITHUB_ENV so both signing steps use it
      # without the caller having to keep two secrets in sync.
      - name: Detect keystore type
        id: ks_type
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # keytool -list prints "Keystore type: PKCS12" or "Keystore type: JKS"
          KS_TYPE=$(keytool -list             -keystore android/app/release-keystore.jks             -storepass:env KEYSTORE_PASSWORD             2>/dev/null | grep -i "Keystore type" | awk '{print $NF}')
          echo "type=$KS_TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected keystore type: $KS_TYPE"

      # ── Signed APK ──
      - name: Sign APK
        id: sign_apk
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # For PKCS12 the key password must equal the store password.
          # For JKS it can differ — KEY_PASSWORD secret is used as-is.
          KEY_PASSWORD: ${{ steps.ks_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find android/app/build -name "*-release-unsigned.apk" | head -1)
          ALIGNED_APK="android/app/build/outputs/apk/release/scrollix-release.apk"

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)"

          "$BUILD_TOOLS_DIR/zipalign" -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # env: prefix — apksigner reads the password from the environment
          # variable directly, never from the command string. This is the only
          # safe method for passwords containing $, @, ! or other shell-special
          # characters that would be silently corrupted by shell interpolation.
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks android/app/release-keystore.jks \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "env:KEY_PASSWORD" \
            "$ALIGNED_APK"

          echo "✅ APK signed (${{ steps.ks_type.outputs.type }}) successfully"

      # ── Unsigned APK fallback ──
      - name: Copy unsigned APK (fallback)
        if: steps.keystore.outputs.available != 'true' || steps.sign_apk.outcome == 'failure'
        run: |
          UNSIGNED_APK=$(find android/app/build -name "*-release-unsigned.apk" | head -1)
          cp "$UNSIGNED_APK" android/app/build/outputs/apk/release/scrollix-release.apk
          if [[ "${{ steps.sign_apk.outcome }}" == "failure" ]]; then
            echo "::warning title=Unsigned APK::Signing failed — keystore password mismatch or corrupt keystore. See ANDROID.md to regenerate the keystore. APK is unsigned."
          else
            echo "::warning title=Unsigned APK::KEYSTORE_BASE64 secret not set. APK is unsigned."
          fi

      # ── Signed AAB ──
      - name: Sign AAB
        id: sign_aab
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # For PKCS12 the key password must equal the store password.
          # For JKS it can differ — KEY_PASSWORD secret is used as-is.
          KEY_PASSWORD: ${{ steps.ks_type.outputs.type == 'PKCS12' && secrets.KEYSTORE_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_AAB=$(find android/app/build -name "*-release.aab" | head -1)
          SIGNED_AAB="android/app/build/outputs/bundle/release/scrollix-release.aab"

          # :file suffix — jarsigner reads the password as raw bytes from a temp
          # file written by printf (no trailing newline, no shell interpretation).
          # This is the safe equivalent of apksigner's env: prefix for passwords
          # containing $, @, ! or other shell-special characters.
          PASS_FILE=$(mktemp)
          KEY_PASS_FILE=$(mktemp)
          printf '%s' "${KEYSTORE_PASSWORD}" > "$PASS_FILE"
          printf '%s' "${KEY_PASSWORD}" > "$KEY_PASS_FILE"

          jarsigner -verbose \
            -keystore android/app/release-keystore.jks \
            -storepass:file "$PASS_FILE" \
            -keypass:file "$KEY_PASS_FILE" \
            -signedjar "$SIGNED_AAB" \
            "$UNSIGNED_AAB" \
            "${KEY_ALIAS}"

          rm -f "$PASS_FILE" "$KEY_PASS_FILE"
          echo "✅ AAB signed (${{ steps.ks_type.outputs.type }}) successfully"

      # ── Unsigned AAB fallback ──
      - name: Copy unsigned AAB (fallback)
        if: steps.keystore.outputs.available != 'true' || steps.sign_aab.outcome == 'failure'
        run: |
          UNSIGNED_AAB=$(find android/app/build -name "*-release.aab" | head -1)
          cp "$UNSIGNED_AAB" android/app/build/outputs/bundle/release/scrollix-release.aab
          if [[ "${{ steps.sign_aab.outcome }}" == "failure" ]]; then
            echo "::warning title=Unsigned AAB::Signing failed — keystore password mismatch or corrupt keystore. See ANDROID.md to regenerate the keystore. AAB is unsigned."
          else
            echo "::warning title=Unsigned AAB::KEYSTORE_BASE64 secret not set. AAB is unsigned."
          fi

      # ── Commit releases to branch ──
      - name: Commit APK & AAB to branch
        run: |
          mkdir -p releases
          # Remove old builds before copying new ones
          rm -f releases/scrollix-release.apk releases/scrollix-release.aab
          cp android/app/build/outputs/apk/release/scrollix-release.apk releases/scrollix-release.apk
          cp android/app/build/outputs/bundle/release/scrollix-release.aab releases/scrollix-release.aab

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add releases/
          git diff --cached --quiet || git commit -m "build: update APK & AAB releases [skip ci]"
          git push

      # ── Upload artifacts ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrollix-release-apk
          path: android/app/build/outputs/apk/release/scrollix-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: scrollix-release-aab
          path: android/app/build/outputs/bundle/release/scrollix-release.aab
          retention-days: 30

      # ── GitHub Release (on tag push) ──
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/scrollix-release.apk
            android/app/build/outputs/bundle/release/scrollix-release.aab
