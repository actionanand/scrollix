<div class="video-card">
  @if (item().title) {
    <h3 class="video-title">{{ item().title }}</h3>
  }
  <div class="video-wrapper" [class.video-wrapper--vertical]="vertical()">
    @if (iframeLoading()) {
      <div class="loading-overlay" aria-hidden="true">
        <div class="spinner"></div>
      </div>
    }
    @if (isYoutube()) {
      <div
        [id]="ytPlayerId()"
        class="yt-player-slot"
        [title]="item().title || 'Video ' + item().sNo"
      ></div>
    } @else {
      <iframe
        #playerIframe
        [src]="embedUrl()"
        (load)="onIframeLoad()"
        allow="
          accelerometer;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        allowfullscreen
        [title]="item().title || 'Video ' + item().sNo"
        loading="lazy"
      ></iframe>
    }
  </div>
  @if (item().desc) {
    <p class="video-desc">{{ item().desc }}</p>
  }
  <div class="video-controls">
    <button class="ctrl-btn" (click)="toggleMute()" [attr.aria-label]="muted() ? 'Unmute' : 'Mute'">
      @if (muted()) {
        🔇 Muted
      } @else {
        🔊 Mute
      }
    </button>
    @if (pipSupported) {
      <button class="ctrl-btn" (click)="requestPip()" aria-label="Picture in Picture">⧉ PIP</button>
    }
    <button class="ctrl-btn" (click)="requestFullscreen()" aria-label="Fullscreen">⛶ Full</button>
    <button class="ctrl-btn" (click)="openOriginal()" aria-label="Open original">↗ Open</button>
    <button class="ctrl-btn" (click)="copyLink()" aria-label="Copy link">📋 Copy</button>
  </div>
  @if (item().startTime) {
    <span class="start-time">Starts at {{ item().startTime }}s</span>
  }
</div>
