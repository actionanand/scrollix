@if (open()) {
  <div class="overlay" role="presentation" (click)="onClose()" (keydown.escape)="onClose()">
    <div
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-heading"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <button class="close-btn" (click)="onClose()" aria-label="Close dialog">✕</button>
      <h2 id="login-heading">Login</h2>
      <form (submit)="$event.preventDefault(); onSubmit()">
        <div class="field">
          <label for="login-username">Username</label>
          <input
            id="login-username"
            [formControl]="usernameControl"
            type="text"
            autocomplete="username"
            placeholder="Enter username"
          />
          @if (usernameError()) {
            <p class="field-error" role="alert">Username is required</p>
          }
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-wrapper">
            <input
              id="login-password"
              [formControl]="passwordControl"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="Enter password"
            />
            <button
              type="button"
              class="eye-btn"
              (click)="toggleShowPassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              @if (showPassword()) {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              } @else {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              }
            </button>
          </div>
        </div>
        @if (loginError()) {
          <p class="login-error" role="alert">Invalid password</p>
        }
        <button type="submit" class="submit-btn">Login</button>
      </form>
    </div>
  </div>
}
